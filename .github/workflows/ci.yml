name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # Report backend and frontend results separately even if one fails
      fail-fast: false
      matrix:
        app: [backend, frontend]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Lets the workflow run before every app folder exists in the repo
      - name: Check that ${{ matrix.app }} exists
        id: app
        run: |
          if [ -f "${{ matrix.app }}/package-lock.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.app }}/ not found, skipping"
          fi

      - name: Set up Node.js
        if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run tests
        if: steps.app.outputs.exists == 'true'
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: Build
        if: steps.app.outputs.exists == 'true'
        working-directory: ${{ matrix.app }}
        run: npm run build --if-present
